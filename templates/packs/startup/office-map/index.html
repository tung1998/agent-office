<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bản đồ văn phòng</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1f2a; color: #e5e7eb; }
    header { padding: 12px 16px 0; font: 600 16px system-ui, sans-serif; }
    #map { height: calc(100% - 40px); }
    .embed header { display: none; }
    .embed #map { height: 100%; }
  </style>
</head>
<body>
  <header>🏢 Bản đồ văn phòng</header>
  <div id="map"></div>
  <script type="module">
    import { mount } from './map.js'
    // ?embed: inside office's watch widget, without the page's own header
    if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed')
    mount(document.getElementById('map'), {
      load: async () => {
        const r = await fetch('/data')
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText)
        return r.json()
      }
    })
  </script>
</body>
</html>
